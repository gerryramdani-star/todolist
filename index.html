<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Update To Do List Tim</title>
    
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 880px; }
        h2 { color: #1e3a8a; text-align: center; margin-bottom: 5px; }
        .date-badge { text-align: center; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 20px; background: #e0f2fe; padding: 4px 10px; border-radius: 20px; display: inline-block; width: 100%;}
        label { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 15px; font-size: 14px;}
        
        .task-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #e5e7eb; flex-wrap: wrap; }
        .task-client-input { flex: 1; min-width: 120px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; }
        .task-edit-input { flex: 2; min-width: 160px; margin-bottom: 0; font-size: 13.5px; background: #ffffff; }
        .task-deadline-input { width: 120px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; }
        .status-picker { width: 110px; padding: 6px; font-size: 12px; font-weight: 600; border-radius: 20px; margin-bottom: 0;}
        .task-ket-input { flex: 1.2; min-width: 130px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; display: none; }

        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-add { background: #f3f4f6; color: #2563eb; border: 1px dashed #2563eb; margin-bottom: 10px; }
        .btn-note-toggle { background: #f8fafc; color: #475569; border: 1px dashed #94a3b8; margin-bottom: 15px; text-align: left; font-size: 13px; }
        .btn-submit { background: #16a34a; font-size: 15px; padding: 12px; margin-top: 10px; }
        .section-box { display: none; margin-bottom: 20px; background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; }
        .help-text { font-size: 11px; color: #6b7280; display: block; margin-top: -10px; margin-bottom: 15px; }

        #kpi-notification { display: none; margin-bottom: 15px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }
        .status-Empty, select.status-picker:invalid { background: #ffffff; color: #6b7280; border-color: #d1d5db; }
        .status-Belum { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
        .status-OnProgress { background: #fef08a; color: #854d0e; border-color: #fde047; }
        .status-Selesai { background: #dcfce7; color: #166534; border-color: #86efac; }
        .status-Cancel { background: #e5e7eb; color: #374151; border-color: #d1d5db; }

        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #ffffff; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .modal-content p { font-size: 15px; color: #374151; margin-bottom: 20px; font-weight: 500; }
        .modal-buttons button { width: auto; min-width: 80px; margin: 0 5px; padding: 8px 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 To Do List & Update Harian</h2>
        <div style="text-align: center;">
            <span class="date-badge" id="realtime-date-badge">📅 Memuat Tanggal Real-Time...</span>
        </div>
        
        <label>Masukkan Nama Lengkap Anda (PIC)</label>
        <input type="text" id="pic-name" placeholder="Contoh: Adi Julian (ketik lengkap)" oninput="checkLocalTasks()" onblur="formatPICInputName()" required>
        <span class="help-text">Ketik nama lengkap lalu klik area kosong di luar kolom ini untuk menyinkronkan data dari server.</span>

        <div id="existing-section" class="section-box">
            <div id="kpi-notification"></div>

            <label style="color:#1e40af; margin-bottom:10px;">⚡ Daftar Tugas Hari Ini (Bisa edit nama klien, redaksi, status, deadline, & keterangan):</label>
            <div id="existing-task-container"></div>
            
            <button type="button" class="btn-add" style="background:#ffffff;" onclick="addInlineTaskRow()">+ Tambah Tugas Baru Jam Ini</button>

            <button type="button" id="btn-toggle-note" class="btn-note-toggle" onclick="toggleNoteField()">📝 + Tambah Catatan / Note Tambahan</button>
            <div id="note-container" style="display: none; margin-bottom: 15px;">
                <label style="color:#374151; margin-bottom:6px;">📌 Catatan Tambahan / Note:</label>
                <textarea id="additional-note" placeholder="Tuliskan catatan atau instruksi tambahan di sini jika ada..." style="height:70px; resize:vertical; font-family:inherit; margin-bottom:0;"></textarea>
            </div>
            
            <input type="hidden" id="wa-number" value="6285721092783">
            <button type="button" class="btn-submit" style="background:#16a34a;" onclick="saveAndUpdateAll()">💾 Simpan Perubahan & Kirim Rekap ke WA</button>
        </div>
    </div>

    <div id="custom-modal">
        <div class="modal-content">
            <p id="modal-text"></p>
            <div class="modal-buttons" id="modal-buttons"></div>
        </div>
    </div>

    <script>
        // 🔴🔴🔴🔴🔴 PASTE URL WEB APP ANDA DI SINI 🔴🔴🔴🔴🔴
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzo4oHEgdyBrNGuFiZAbMJE43eqFf2FZLT4iX8bBBSiJ9iWdsm0ILCBw3aj7P5bJmj3/exec'; 

        const TEAM_CONFIG = {
            'Content Writer': { target: 16, members: ['Anne', 'Natasya', 'Widia'], defaultPoint: 1.0, rules: [] },
            'Graphic Designer': { target: 14, members: ['Muqita', 'Qalbi', 'Raditya', 'Ramsat'], defaultPoint: 1.0, rules: [{keyword:'carousel', point:3.5}] },
            'Video Editor': { target: 9, members: ['Adi Julian', 'Ghaly', 'Raihani'], defaultPoint: 1.0, rules: [{keyword:'edukasi', point:2.25}] },
            'Videografer': { target: 12, members: ['Dzakwan'], defaultPoint: 1.0, rules: [{keyword:'visit', point:6}, {keyword:'full', point:12}] },
            'Advertiser': { target: 12, members: ['Gerry', 'Ikmal'], defaultPoint: 1.5, rules: [] },
            'KOL Specialist': { 
                target: 18, 
                members: ['Ayunda'], 
                defaultPoint: 1.0, 
                rules: [
                    {keyword:'report bulanan', point: 8},
                    {keyword:'brief campaign', point: 8},
                    {keyword:'riset, meet, briefing', point: 2.5},
                    {keyword:'buat dashboard', point: 2.5},
                    {keyword:'finishing campaign', point: 1.3},
                    {keyword:'update dashboard', point: 1.3},
                    {keyword:'finishing report', point: 1.3},
                    {keyword:'listing', point: 0.5},
                    {keyword:'invoice', point: 0.5},
                    {keyword:'approuch', point: 0.3}
                ]
            },
            'Social Media Specialist': { 
                target: 14, 
                members: ['Zhera'], 
                defaultPoint: 1.0, 
                rules: [
                    {keyword:'visit full, 8 jam, visit half, 4 jam', point: 14},
                    {keyword:'report, insight, monthly', point: 6},
                    {keyword:'riset, reminder, meet, meeting', point: 2},
                    {keyword:'upload, posting', point: 0.2}
                ]
            },
            'Marketing': {
                target: 14,
                members: ['Wanda'],
                defaultPoint: 1.0,
                rules: [
                    {keyword:'revisi proposal, revisi deck', point: 4},
                    {keyword:'proposal, deck', point: 6},
                    {keyword:'prospek, meeting', point: 3},
                    {keyword:'surat', point: 0.7},
                    {keyword:'mou', point: 0.5},
                    {keyword:'follow up, lead, crm', point: 0.35}
                ]
            }
        };

        function updateDateBadge() {
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('realtime-date-badge').innerText = "📅 Hari ini: " + new Date().toLocaleDateString('id-ID', dateOptions);
        }
        updateDateBadge();

        function checkLocalTasks() {
            let picName = document.getElementById('pic-name').value.trim();
            if (picName.length < 3) {
                document.getElementById('existing-section').style.display = 'none';
                return;
            }
            document.getElementById('existing-section').style.display = 'block';
            fetchServerData(picName);
        }

        function formatPICInputName() {
            let input = document.getElementById('pic-name');
            let words = input.value.toLowerCase().split(' ');
            for (let i = 0; i < words.length; i++) {
                if (words[i]) words[i] = words[i][0].toUpperCase() + words[i].substr(1);
            }
            input.value = words.join(' ');
            checkLocalTasks();
        }

        function fetchServerData(picName) {
            const container = document.getElementById('existing-task-container');
            container.innerHTML = '<div style="text-align:center; padding:20px; font-weight:bold; color:#2563eb;">⏳ Sedang menyinkronkan data dari server...</div>';
            
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            
            fetch(GOOGLE_SCRIPT_URL + '?action=getTasks&nama=' + encodeURIComponent(picName) + '&tanggal=' + encodeURIComponent(dateStr))
                .then(res => res.json())
                .then(res => {
                    container.innerHTML = '';
                    if (res.status === 'sukses' && res.data && res.data.length > 0) {
                        res.data.forEach(task => {
                            appendTaskRow(task.id, task.klien, task.task, task.deadline, task.status, task.keterangan);
                        });
                    } else {
                        appendTaskRow('task_' + Date.now()); 
                    }
                    updateKPICheck();
                })
                .catch(err => {
                    container.innerHTML = '<div style="text-align:center; padding:10px; color:#dc2626;">Gagal memuat data tersinkronisasi. Menampilkan kolom baru...</div>';
                    appendTaskRow('task_' + Date.now());
                    updateKPICheck();
                });
        }

        function appendTaskRow(id, klien='', task='', deadline='', status='', ket='') {
            const container = document.getElementById('existing-task-container');
            const div = document.createElement('div');
            div.className = 'task-row';
            div.id = id;
            
            const statusClass = status ? 'status-' + status.replace(/\s+/g, '') : 'status-Empty';
            const displayKet = (status === 'Belum' || status === 'Cancel' || ket) ? 'block' : 'none';

            div.innerHTML = `
                <input type="text" class="task-client-input" placeholder="Nama Klien..." value="${klien}" oninput="updateKPICheck()">
                <input type="text" class="task-edit-input" placeholder="Tugas yang dikerjakan..." value="${task}" oninput="updateKPICheck()">
                <input type="date" class="task-deadline-input" value="${deadline}">
                <select class="status-picker ${statusClass}" onchange="updateStatusColor(this)">
                    <option value="" disabled ${!status ? 'selected' : ''}>-- Status --</option>
                    <option value="Selesai" ${status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                    <option value="On Progress" ${status === 'On Progress' ? 'selected' : ''}>On Progress</option>
                    <option value="Belum" ${status === 'Belum' ? 'selected' : ''}>Belum</option>
                    <option value="Cancel" ${status === 'Cancel' ? 'selected' : ''}>Cancel</option>
                </select>
                <input type="text" class="task-ket-input" placeholder="Ket. opsional..." value="${ket}" style="display:${displayKet};">
                <button type="button" style="background:#dc2626; color:white; width:auto; padding:6px 12px; font-weight:bold;" onclick="this.parentElement.remove(); updateKPICheck()">X</button>
            `;
            container.appendChild(div);
        }

        function addInlineTaskRow() {
            appendTaskRow('task_' + Date.now());
            updateKPICheck();
        }

        function updateStatusColor(selectEl) {
            selectEl.className = 'status-picker status-' + selectEl.value.replace(/\s+/g, '');
            const row = selectEl.parentElement;
            const ketInput = row.querySelector('.task-ket-input');
            if (selectEl.value === 'Belum' || selectEl.value === 'Cancel') {
                ketInput.style.display = 'block';
                ketInput.placeholder = selectEl.value === 'Cancel' ? 'Ket. alasan cancel...' : 'Ket. jika belum selesai...';
            } else {
                ketInput.style.display = ketInput.value ? 'block' : 'none';
            }
            updateKPICheck();
        }

        function toggleNoteField() {
            const noteContainer = document.getElementById('note-container');
            if (noteContainer.style.display === 'none') {
                noteContainer.style.display = 'block';
            } else {
                noteContainer.style.display = 'none';
                document.getElementById('additional-note').value = '';
            }
        }

        function findUserRole(name) {
            const searchName = name.toLowerCase();
            for (const [role, data] of Object.entries(TEAM_CONFIG)) {
                if (data.members.some(member => searchName.includes(member.toLowerCase()))) {
                    return { role: role, config: data };
                }
            }
            return null;
        }

        function updateKPICheck() {
            const picName = document.getElementById('pic-name').value.trim();
            const userConfig = findUserRole(picName);
            const kpiDiv = document.getElementById('kpi-notification');

            if (!userConfig) {
                kpiDiv.style.display = 'none';
                return;
            }

            let totalPoints = 0;
            const taskRows = document.querySelectorAll('#existing-task-container .task-row');
            
            taskRows.forEach(row => {
                const taskText = row.querySelector('.task-edit-input').value.toLowerCase();
                const statusEl = row.querySelector('.status-picker');
                
                // Menghitung bobot jika ada teks, dan status BUKAN Cancel.
                if (taskText && statusEl.value !== 'Cancel') {
                    let pointAssigned = userConfig.config.defaultPoint;
                    for (let rule of userConfig.config.rules) {
                        const keywords = rule.keyword.split(',').map(k => k.trim());
                        if (keywords.some(kw => taskText.includes(kw))) {
                            pointAssigned = rule.point;
                            break;
                        }
                    }
                    totalPoints += pointAssigned;
                }
            });

            kpiDiv.style.display = 'block';
            if (totalPoints >= userConfig.config.target) {
                kpiDiv.className = 'status-Selesai';
                kpiDiv.innerHTML = `✅ <b>Target Tercapai!</b> Total estimasi poin saat ini (<b>${totalPoints} Poin</b>) memenuhi Target KPI (${userConfig.config.target} Poin).`;
            } else {
                kpiDiv.className = 'status-Belum';
                kpiDiv.innerHTML = `⚠️ <b>Perhatian (${userConfig.role}):</b> Total estimasi saat ini (<b>${totalPoints} Poin</b>) belum memenuhi Target KPI Harian (<b>${userConfig.config.target} Poin</b>).`;
            }
        }

        function saveAndUpdateAll() {
            const picName = document.getElementById('pic-name').value.trim();
            if(!picName) return showModal("Nama PIC tidak boleh kosong!");
            
            const userConfig = findUserRole(picName);
            const role = userConfig ? userConfig.role : 'Umum';
            
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            let currentTime = "'" + today.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'}).replace('.', ':');
            
            let exportData = [];
            let waText = `To Do List *${picName}* *(${String(today.getDate()).padStart(2, '0')}/${String(today.getMonth() + 1).padStart(2, '0')}/${String(today.getFullYear()).substr(-2)})*:\n\n`;
            let counter = 1;
            
            const taskRows = document.querySelectorAll('#existing-task-container .task-row');
            taskRows.forEach((row, index) => {
                let taskClient = row.querySelector('.task-client-input').value.trim();
                let taskName = row.querySelector('.task-edit-input').value.trim();
                let taskDeadline = row.querySelector('.task-deadline-input').value;
                let statusEl = row.querySelector('.status-picker');
                
                // MENGIZINKAN STATUS KOSONG
                let taskStatus = statusEl.value || ''; 
                let taskKet = row.querySelector('.task-ket-input').value.trim();
                
                if (taskName) {
                    let pointAssigned = userConfig ? userConfig.config.defaultPoint : 1;
                    for (let rule of (userConfig ? userConfig.config.rules : [])) {
                        const keywords = rule.keyword.split(',').map(k => k.trim());
                        if (keywords.some(kw => taskName.toLowerCase().includes(kw))) {
                            pointAssigned = rule.point;
                            break;
                        }
                    }
                    
                    exportData.push({
                        no: index + 1,
                        nama: picName,
                        role: role,
                        tanggal: dateStr,
                        waktuKirim: currentTime,
                        klien: taskClient,
                        task: taskName,
                        qty: 1,
                        poin: pointAssigned,
                        deadline: taskDeadline,
                        status: taskStatus,
                        keterangan: taskKet
                    });
                    
                    // FORMAT PESAN WA (Hanya centang untuk 'Selesai')
                    let waRow = `${counter}. ${taskName}`;
                    if (taskStatus === 'Selesai') {
                        waRow += " ✅";
                    }
                    waText += waRow + "\n";
                    counter++;
                }
            });
            
            const additionalNote = document.getElementById('additional-note').value.trim();
            if (additionalNote) {
                waText += `\n*Catatan Tambahan:*\n${additionalNote}`;
            }
            
            if (exportData.length === 0) return showModal("Tidak ada tugas yang diisi!");
            
            const btn = document.querySelector('.btn-submit');
            btn.innerText = "⏳ Sedang Menyimpan...";
            btn.disabled = true;

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                redirect: 'follow', // Penting untuk bypass blokir browser mobile
                body: JSON.stringify(exportData)
            })
            .then(res => res.json())
            .then(res => {
                if (res.status === 'sukses') {
                    const waNumber = document.getElementById('wa-number').value;
                    const finalWaLink = `https://wa.me/${waNumber}?text=${encodeURIComponent(waText)}`;
                    
                    document.getElementById('modal-text').innerHTML = "✅ <b>Data Berhasil Disimpan & Diupdate ke Server!</b><br><br>Klik Lanjut untuk mengirimkan rekap ke grup WhatsApp.";
                    const modalBtns = document.getElementById('modal-buttons');
                    modalBtns.innerHTML = `<button style="background:#16a34a; color:white;" onclick="window.open('${finalWaLink}', '_blank'); closeModal();">Lanjut ke WA</button>`;
