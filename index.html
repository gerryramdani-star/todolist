<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Update To Do List Tim</title>
    
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 880px; }
        h2 { color: #1e3a8a; text-align: center; margin-bottom: 5px; }
        .date-badge { text-align: center; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 20px; background: #e0f2fe; padding: 4px 10px; border-radius: 20px; display: inline-block; width: 100%;}
        label { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 15px; font-size: 14px;}
        
        /* Baris Tugas Flex Layout */
        .task-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #e5e7eb; flex-wrap: wrap; }
        .task-client-input { flex: 1; min-width: 120px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; }
        .task-edit-input { flex: 2; min-width: 160px; margin-bottom: 0; font-size: 13.5px; background: #ffffff; }
        .task-deadline-input { width: 120px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; }
        .status-picker { width: 110px; padding: 6px; font-size: 12px; font-weight: 600; border-radius: 20px; margin-bottom: 0;}
        .task-ket-input { flex: 1.2; min-width: 130px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; display: none; }

        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-add { background: #f3f4f6; color: #2563eb; border: 1px dashed #2563eb; margin-bottom: 10px; }
        .btn-note-toggle { background: #f8fafc; color: #475569; border: 1px dashed #94a3b8; margin-bottom: 15px; text-align: left; font-size: 13px; }
        .btn-submit { background: #16a34a; font-size: 15px; padding: 12px; margin-top: 10px; }
        .section-box { display: none; margin-bottom: 20px; background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; }
        .help-text { font-size: 11px; color: #6b7280; display: block; margin-top: -10px; margin-bottom: 15px; }

        /* Notifikasi Box KPI */
        #kpi-notification { display: none; margin-bottom: 15px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }

        /* Status Styling di Form */
        .status-Empty, select.status-picker:invalid { background: #ffffff; color: #6b7280; border-color: #d1d5db; }
        .status-Belum { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
        .status-OnProgress { background: #fef08a; color: #854d0e; border-color: #fde047; }
        .status-Selesai { background: #dcfce7; color: #166534; border-color: #86efac; }
        .status-Cancel { background: #e5e7eb; color: #374151; border-color: #d1d5db; }

        /* Custom Modal Styling untuk menggantikan alert dan confirm bawaan browser */
        #custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #ffffff; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 10px 15px rgba(0,0,0,0.1); }
        .modal-content p { font-size: 15px; color: #374151; margin-bottom: 20px; font-weight: 500; }
        .modal-buttons button { width: auto; min-width: 80px; margin: 0 5px; padding: 8px 16px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 To Do List & Update Harian</h2>
        <div style="text-align: center;">
            <span class="date-badge" id="realtime-date-badge">📅 Memuat Tanggal Real-Time...</span>
        </div>
        
        <label>Masukkan Nama Lengkap Anda (PIC)</label>
        <input type="text" id="pic-name" placeholder="Contoh: Adi Julian (ketik lengkap)" oninput="checkExistingTasks()" onblur="formatPICInputName()" required>
        <span class="help-text">Daftar tugas hari ini akan muncul otomatis setelah Anda mengetik nama lengkap PIC dengan benar.</span>

        <!-- BAGIAN UTAMA -->
        <div id="existing-section" class="section-box">
            <!-- Box Reminder KPI -->
            <div id="kpi-notification"></div>

            <label style="color:#1e40af; margin-bottom:10px;">⚡ Daftar Tugas Hari Ini (Bisa edit nama klien, redaksi, status, deadline, & keterangan):</label>
            <div id="existing-task-container"></div>
            
            <button type="button" class="btn-add" style="background:#ffffff;" onclick="addInlineTaskRow()">+ Tambah Tugas Baru Jam Ini</button>

            <!-- TOMBOL FITUR CATATAN TAMBAHAN (NOTE) -->
            <button type="button" id="btn-toggle-note" class="btn-note-toggle" onclick="toggleNoteField()">📝 + Tambah Catatan / Note Tambahan</button>
            <div id="note-container" style="display: none; margin-bottom: 15px;">
                <label style="color:#374151; margin-bottom:6px;">📌 Catatan Tambahan / Note:</label>
                <textarea id="additional-note" placeholder="Tuliskan catatan atau instruksi tambahan di sini jika ada..." style="height:70px; resize:vertical; font-family:inherit; margin-bottom:0;"></textarea>
            </div>
            
            <input type="hidden" id="wa-number" value="6285721092783">
            <button type="button" class="btn-submit" style="background:#16a34a;" onclick="saveAndUpdateAll()">💾 Simpan Perubahan & Kirim Rekap ke WA</button>
        </div>
    </div>

    <!-- Elemen Custom Modal -->
    <div id="custom-modal">
        <div class="modal-content">
            <p id="modal-text"></p>
            <div class="modal-buttons" id="modal-buttons"></div>
        </div>
    </div>

    <script>
        // 🔴 PENTING: PASTE URL WEB APP DARI GOOGLE APPS SCRIPT DI BAWAH INI
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyLrcwt8Pz4XG3h-Nz3wyunkzcyIkcUXKIACmHaDCcXHRwnRfXX7OZN2QSX5x9TwWs/exec';

        const TEAM_CONFIG = JSON.parse(localStorage.getItem('kpi_team_config')) || {
            'Content Writer': { target: 16, members: ['Anne', 'Natasya', 'Widia'], defaultPoint: 1.0, rules: [] },
            'Graphic Designer': { target: 14, members: ['Muqita', 'Qalbi', 'Raditya', 'Ramsat'], defaultPoint: 1.0, rules: [{keyword:'carousel', point:3.5}] },
            'Video Editor': { target: 9, members: ['Adi Julian', 'Ghaly', 'Raihani'], defaultPoint: 1.0, rules: [{keyword:'edukasi', point:2.25}] },
            'Videografer': { target: 12, members: ['Dzakwan'], defaultPoint: 1.0, rules: [{keyword:'visit', point:6}, {keyword:'full', point:12}] },
            'Social Media Specialist': { target: 14, members: ['Zhera'], defaultPoint: 2.0, rules: [{keyword:'visit', point:7}] },
            'Marketing': { target: 14, members: ['Wanda'], defaultPoint: 1.0, rules: [{keyword:'proposal', point:6}] },
            'Advertiser': { target: 12, members: ['Gerry', 'Ikmal'], defaultPoint: 1.5, rules: [] }
        };

        function toTitleCase(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/(?:^|\s)\S/g, function(a) { return a.toUpperCase(); });
        }

        function formatPICInputName() {
            const inputEl = document.getElementById('pic-name');
            if (inputEl) {
                inputEl.value = toTitleCase(inputEl.value);
            }
        }

        function showAlert(msg, callback = null) {
            const modal = document.getElementById('custom-modal');
            const text = document.getElementById('modal-text');
            const buttons = document.getElementById('modal-buttons');
            text.innerText = msg;
            buttons.innerHTML = '<button onclick="closeModal(true)" style="background:#2563eb; color:white;">OK</button>';
            modal.style.display = 'flex';
            modal.callback = callback;
        }

        function showConfirm(msg, callback) {
            const modal = document.getElementById('custom-modal');
            const text = document.getElementById('modal-text');
            const buttons = document.getElementById('modal-buttons');
            text.innerText = msg;
            buttons.innerHTML = `
                <button onclick="closeModal(true)" style="background:#dc2626; color:white;">Ya</button>
                <button onclick="closeModal(false)" style="background:#6b7280; color:white;">Batal</button>
            `;
            modal.style.display = 'flex';
            modal.callback = callback;
        }

        function closeModal(result) {
            const modal = document.getElementById('custom-modal');
            modal.style.display = 'none';
            if (result && typeof modal.callback === 'function') {
                modal.callback();
            }
        }

        function getTodayISO() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateToID(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('/')) return dateStr;
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        function getTodayFormatted() {
            const d = new Date();
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear().toString().slice(-2);
            return `${day}/${month}/${year}`;
        }

        window.onload = function() {
            const d = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('realtime-date-badge').innerText = `📅 Hari ini: ${d.toLocaleDateString('id-ID', options)}`;
        };

        function getRoleByName(name) {
            if (!name) return null;
            const lower = name.trim().toLowerCase();
            for (const [role, config] of Object.entries(TEAM_CONFIG)) {
                if (config.members.some(m => m.toLowerCase() === lower)) return role;
            }
            return null;
        }

        function parseTaskQtyAndPoin(name, taskText) {
            if (!taskText) return { qty: 0, totalPoin: 0 };
            
            const role = getRoleByName(name) || 'Content Writer';
            const config = TEAM_CONFIG[role];
            let basePt = config ? config.defaultPoint : 1.0;

            if (config && config.rules) {
                let lowerTask = taskText.toLowerCase();
                for (let r of config.rules) {
                    let kws = r.keyword.split(',').map(k=>k.trim().toLowerCase()).filter(k=>k);
                    if (kws.some(kw => lowerTask.includes(kw))) { 
                        basePt = r.point; 
                        break; 
                    }
                }
            }

            let qty = 1;
            const rangeMatch = taskText.match(/(?:tgl|tanggal)?\s*(\d{1,2})\s*(?:-|s\/d|sampai)\s*(\d{1,2})/i);
            const listMatch = taskText.match(/(?:tgl|tanggal)?\s*(\d{1,2}(?:\s*(?:,|&|\bdan\b)\s*\d{1,2})+)/i);

            if (rangeMatch) {
                const start = parseInt(rangeMatch[1], 10);
                const end = parseInt(rangeMatch[2], 10);
                if (end >= start && end <= 31 && start >= 1) {
                    qty = (end - start + 1);
                }
            } else if (listMatch) {
                const numbers = listMatch[0].match(/\d{1,2}/g);
                if (numbers) {
                    const validDays = numbers.filter(n => {
                        let num = parseInt(n, 10);
                        return num >= 1 && num <= 31;
                    });
                    if (validDays.length > 0) {
                        qty = validDays.length;
                    }
                }
            }

            return { qty: qty, totalPoin: basePt * qty };
        }

        function handleStatusChange(selectEl) {
            const val = selectEl.value;
            selectEl.className = 'status-picker status-' + (val ? val.replace(/\s+/g, '') : 'Empty');
            
            const row = selectEl.closest('.task-row');
            const ketInput = row.querySelector('.task-ket-input');
            
            if (ketInput) {
                if (val === 'Belum' || val === 'Cancel') {
                    ketInput.style.display = 'block';
                    ketInput.placeholder = (val === 'Cancel') ? 'Ket. alasan cancel...' : 'Ket. jika belum selesai...';
                } else {
                    ketInput.style.display = 'none';
                }
            }
            updateKPICheck();
        }

        function updateKPICheck() {
            const rawName = document.getElementById('pic-name').value.trim();
            const name = toTitleCase(rawName);
            const notificationEl = document.getElementById('kpi-notification');
            const role = getRoleByName(name);
            
            if (!role) {
                if (notificationEl) notificationEl.style.display = 'none';
                return;
            }

            const targetKPI = TEAM_CONFIG[role] ? TEAM_CONFIG[role].target : 10;
            let grandTotalPoin = 0;
            const taskRows = document.querySelectorAll('#existing-task-container .task-row');
            
            taskRows.forEach(row => {
                let textEl = row.querySelector('.task-edit-input');
                if (textEl && textEl.value.trim() !== '') {
                    let res = parseTaskQtyAndPoin(name, textEl.value.trim());
                    grandTotalPoin += res.totalPoin;
                }
            });

            if (notificationEl) {
                notificationEl.style.display = 'block';
                if (grandTotalPoin < targetKPI) {
                    notificationEl.style.background = '#fef2f2';
                    notificationEl.style.color = '#991b1b';
                    notificationEl.style.border = '1px solid #fca5a5';
                    notificationEl.innerHTML = `⚠️ <b>Perhatian (${role}):</b> Total estimasi saat ini (<b>${grandTotalPoin} Poin</b>) belum memenuhi Target KPI Harian (<b>${targetKPI} Poin</b>).`;
                } else {
                    notificationEl.style.background = '#f0fdf4';
                    notificationEl.style.color = '#166534';
                    notificationEl.style.border = '1px solid #86efac';
                    notificationEl.innerHTML = `✅ <b>Mantap (${role}):</b> Total estimasi saat ini (<b>${grandTotalPoin} Poin</b>) telah memenuhi Target KPI Harian (<b>${targetKPI} Poin</b>)!`;
                }
            }
        }

        function toggleNoteField() {
            const noteContainer = document.getElementById('note-container');
            const btn = document.getElementById('btn-toggle-note');
            if (noteContainer.style.display === 'none') {
                noteContainer.style.display = 'block';
                btn.innerText = '📝 - Sembunyikan Catatan / Note';
            } else {
                noteContainer.style.display = 'none';
                btn.innerText = '📝 + Tambah Catatan / Note Tambahan';
            }
        }

        function checkExistingTasks() {
            const rawName = document.getElementById('pic-name').value.trim();
            const nameInput = toTitleCase(rawName);
            const existingSection = document.getElementById('existing-section');
            const container = document.getElementById('existing-task-container');
            container.innerHTML = '';

            const role = getRoleByName(nameInput);

            if (!role) {
                existingSection.style.display = 'none';
                const notificationEl = document.getElementById('kpi-notification');
                if (notificationEl) notificationEl.style.display = 'none';
                return;
            }

            let db = JSON.parse(localStorage.getItem('daily_report_db')) || [];
            let today = getTodayISO();

            let userTasks = db.filter(d => d.tanggal === today && d.nama.toLowerCase() === nameInput.toLowerCase());

            existingSection.style.display = 'block';

            if (userTasks.length === 0) {
                addInlineTaskRow();
            } else {
                userTasks.forEach((t) => {
                    let deadlineVal = t.deadline || '';
                    let ketVal = t.keterangan || '';
                    let clientVal = t.klien || '';
                    let statusVal = t.status || '';
                    
                    let showKetStyle = (statusVal === 'Belum' || statusVal === 'Cancel') ? 'display: block;' : 'display: none;';
                    let ketPlaceholder = (statusVal === 'Cancel') ? 'Ket. alasan cancel...' : 'Ket. jika belum selesai...';
                    
                    let row = document.createElement('div');
                    row.className = 'task-row';
                    row.setAttribute('data-id', t.id);
                    row.innerHTML = `
                        <input type="text" class="task-client-input" id="client-${t.id}" value="${clientVal}" placeholder="Nama Klien...">
                        <input type="text" class="task-edit-input" id="text-${t.id}" value="${t.task}" placeholder="Tugas..." oninput="updateKPICheck()">
                        <input type="date" class="task-deadline-input" id="deadline-${t.id}" value="${deadlineVal}">
                        <select class="status-picker status-${statusVal.replace(/\s+/g, '') || 'Empty'}" id="status-${t.id}" onchange="handleStatusChange(this)">
                            <option value="" ${statusVal === '' ? 'selected disabled':''}>-- Status --</option>
                            <option value="Belum" ${statusVal === 'Belum' ? 'selected':''}>Belum</option>
                            <option value="On Progress" ${statusVal === 'On Progress' ? 'selected':''}>On Progress</option>
                            <option value="Selesai" ${statusVal === 'Selesai' ? 'selected':''}>Selesai</option>
                            <option value="Cancel" ${statusVal === 'Cancel' ? 'selected':''}>Cancel</option>
                        </select>
                        <input type="text" class="task-ket-input" id="ket-${t.id}" value="${ketVal}" placeholder="${ketPlaceholder}" style="${showKetStyle}">
                        <button type="button" style="width:32px; background:#dc2626; color:white; border:none; border-radius:4px; cursor:pointer; padding:6px;" onclick="removeTaskItem(this, '${t.id}')">X</button>
                    `;
                    container.appendChild(row);
                });
            }
            updateKPICheck();
        }

        function addInlineTaskRow() {
            const container = document.getElementById('existing-task-container');
            let newId = 'new_' + Math.random().toString(36).substr(2, 9);
            let row = document.createElement('div');
            row.className = 'task-row';
            row.setAttribute('data-id', newId);
            row.innerHTML = `
                <input type="text" class="task-client-input" id="client-${newId}" placeholder="Nama Klien...">
                <input type="text" class="task-edit-input new-task-field" id="text-${newId}" placeholder="Tugas baru hari ini..." oninput="updateKPICheck()">
                <input type="date" class="task-deadline-input" id="deadline-${newId}">
                <select class="status-picker status-Empty" id="status-${newId}" onchange="handleStatusChange(this)">
                    <option value="" selected disabled>-- Status --</option>
                    <option value="Belum">Belum</option>
                    <option value="On Progress">On Progress</option>
                    <option value="Selesai">Selesai</option>
                    <option value="Cancel">Cancel</option>
                </select>
                <input type="text" class="task-ket-input" id="ket-${newId}" placeholder="Ket. jika belum selesai..." style="display: none;">
                <button type="button" style="width:32px; background:#dc2626; color:white; border:none; border-radius:4px; cursor:pointer; padding:6px;" onclick="this.parentElement.remove(); updateKPICheck();">X</button>
            `;
            container.appendChild(row);
            updateKPICheck();
        }

        function removeTaskItem(btn, id) {
            // Menggunakan custom confirm
            showConfirm('Hapus tugas ini?', () => {
                let db = JSON.parse(localStorage.getItem('daily_report_db')) || [];
                db = db.filter(d => d.id !== id);
                localStorage.setItem('daily_report_db', JSON.stringify(db));
                btn.parentElement.remove();
                updateKPICheck();
            });
        }

        function saveAndUpdateAll() {
            const rawName = document.getElementById('pic-name').value.trim();
            if (!rawName) {
                showAlert('Masukkan Nama PIC terlebih dahulu!');
                return;
            }

            const name = toTitleCase(rawName);
            document.getElementById('pic-name').value = name;

            const targetNumber = document.getElementById('wa-number').value.trim();
            const noteContainer = document.getElementById('note-container');
            const additionalNote = noteContainer.style.display !== 'none' ? document.getElementById('additional-note').value.trim() : '';

            let db = JSON.parse(localStorage.getItem('daily_report_db')) || [];
            let today = getTodayISO();
            let currentTime = new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
            
            const taskRows = document.querySelectorAll('#existing-task-container .task-row');
            if (taskRows.length === 0) {
                showAlert('Minimal harus ada 1 tugas!');
                return;
            }

            let processedIds = [];
            let waTasksList = [];
            let exportData = []; // NEW: Array khusus untuk menampung data yang akan dikirim ke Spreadsheet

            taskRows.forEach((row, index) => {
                let rowId = row.getAttribute('data-id');
                let clientEl = row.querySelector('.task-client-input');
                let textEl = row.querySelector('.task-edit-input');
                let deadlineEl = row.querySelector('.task-deadline-input');
                let statusEl = row.querySelector('.status-picker');
                let ketEl = row.querySelector('.task-ket-input');

                if(!textEl || !statusEl) return;
                let clientText = clientEl ? clientEl.value.trim() : '';
                let taskText = textEl.value.trim();
                let taskDeadline = deadlineEl ? deadlineEl.value : '';
                let taskStatus = statusEl.value || 'Belum';
                
                let taskKet = ((taskStatus === 'Belum' || taskStatus === 'Cancel') && ketEl) ? ketEl.value.trim() : '';

                if(taskText === '') return;

                let parsed = parseTaskQtyAndPoin(name, taskText);
                let finalPoin = taskStatus === 'Selesai' ? parsed.totalPoin : 0;

                // Menyiapkan dan memasukkan setiap baris data ke dalam array exportData
                exportData.push({
                    no: index + 1,
                    nama: name,
                    role: getRoleByName(name) || 'Content Writer',
                    tanggal: today,
                    waktuKirim: currentTime,
                    klien: clientText,
                    task: taskText,
                    qty: parsed.qty,
                    poin: finalPoin,
                    deadline: taskDeadline,
                    keterangan: taskKet,
                    status: taskStatus
                });

                if (rowId.startsWith('new_')) {
                    let newObj = {
                        id: Math.random().toString(36).substr(2, 9) + Date.now().toString(36),
                        nama: name,
                        klien: clientText,
                        role: getRoleByName(name) || 'Content Writer',
                        tanggal: today,
                        waktuKirim: currentTime,
                        no: db.length + 1,
                        task: taskText,
                        qty: parsed.qty,
                        poin: finalPoin,
                        deadline: taskDeadline,
                        keterangan: taskKet,
                        status: taskStatus
                    };
                    db.push(newObj);
                    processedIds.push(newObj.id);
                    waTasksList.push({ client: clientText, task: taskText, status: taskStatus, deadline: taskDeadline, keterangan: taskKet });
                } else {
                    let existingItem = db.find(d => d.id === rowId);
                    if (existingItem) {
                        existingItem.nama = name;
                        existingItem.klien = clientText;
                        existingItem.task = taskText;
                        existingItem.status = taskStatus;
                        existingItem.deadline = taskDeadline;
                        existingItem.qty = parsed.qty;
                        existingItem.poin = finalPoin;
                        existingItem.keterangan = taskKet;
                        processedIds.push(rowId);
                        waTasksList.push({ client: clientText, task: taskText, status: taskStatus, deadline: taskDeadline, keterangan: taskKet });
                    }
                }
            });

            db = db.filter(d => {
                if (d.tanggal === today && d.nama.toLowerCase() === name.toLowerCase()) {
                    return processedIds.includes(d.id);
                }
                return true;
            });

            localStorage.setItem('daily_report_db', JSON.stringify(db));

            // FORMAT PESAN WA (Hanya Nama dan Tanggal yang tebal)
            let waText = `To Do List *${name}* (*${getTodayFormatted()}*)\n\n`;
            let ketList = [];

            waTasksList.forEach((t, i) => {
                let statusIcon = "";
                if (t.status === 'Selesai') {
                    statusIcon = " ✅";
                } else if (t.status === 'Belum') {
                    statusIcon = " ❌";
                }

                let clientPrefix = t.client ? `[${t.client}] ` : '';
                
                let dlText = "";
                if (t.deadline) {
                    let formattedDL = formatDateToID(t.deadline);
                    if (formattedDL) {
                        dlText = ` [DL: ${formattedDL}]`;
                    }
                }
                
                waText += `${i + 1}. ${clientPrefix}${t.task}${dlText}${statusIcon}\n`;

                if (t.keterangan && t.keterangan !== '') {
                    ketList.push(`${i + 1}. ${t.keterangan}`);
                }
            });

            if (ketList.length > 0) {
                waText += `\nKeterangan Belum Selesai / Cancel :\n\n`;
                waText += ketList.join('\n') + '\n';
            }

            if (additionalNote !== '') {
                waText += `\nCatatan Tambahan :\n${additionalNote}\n`;
            }

            // --- PROSES PENGIRIMAN DATA KE GOOGLE SHEETS ---
            const submitBtn = document.querySelector('.btn-submit');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '⏳ Sedang Menyimpan ke Spreadsheet...';
            submitBtn.disabled = true;

            // Pengecekan apakah URL sudah diisi
            if (GOOGLE_SCRIPT_URL === 'MASUKKAN_URL_WEB_APP_ANDA_DISINI') {
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                showAlert('⚠️️ URL Google Script belum dimasukkan di kode HTML! Data hanya dikirim ke WA.', () => {
                    const encodedText = encodeURIComponent(waText);
                    const waLink = `https://api.whatsapp.com/send?phone=${targetNumber}&text=${encodedText}`;
                    window.location.href = waLink;
                });
                return;
            }

            // Mengirim data JSON ke Google Apps Script
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Menggunakan text/plain agar tidak terblokir CORS
                body: JSON.stringify(exportData)
            })
            .then(response => response.json())
            .then(data => console.log('Sukses simpan ke Spreadsheet:', data))
            .catch(error => console.error('Error saat simpan ke Spreadsheet:', error))
            .finally(() => {
                // Kembalikan status tombol seperti semula
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                
                // Memunculkan notifikasi sukses dan beralih ke WhatsApp
                showAlert('✅ Data berhasil diperbarui & disinkronkan ke Spreadsheet!', () => {
                    const encodedText = encodeURIComponent(waText);
                    const waLink = `https://api.whatsapp.com/send?phone=${targetNumber}&text=${encodedText}`;
                    window.location.href = waLink;
                });
            });
        }
    </script>
</body>
</html>
