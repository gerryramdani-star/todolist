<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form & Update To Do List Tim</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 880px; }
        h2 { color: #1e3a8a; text-align: center; margin-bottom: 5px; }
        .date-badge { text-align: center; font-size: 13px; font-weight: 600; color: #4b5563; margin-bottom: 20px; background: #e0f2fe; padding: 4px 10px; border-radius: 20px; display: inline-block; width: 100%;}
        label { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 15px; font-size: 14px;}
        
        .task-row { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; background: #f9fafb; padding: 8px; border-radius: 6px; border: 1px solid #e5e7eb; flex-wrap: wrap; }
        .task-client-input { flex: 1; min-width: 110px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; }
        .task-edit-input { flex: 2; min-width: 160px; margin-bottom: 0; font-size: 13.5px; background: #ffffff; }
        .task-deadline-input { width: 120px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; }
        .status-picker { width: 110px; padding: 6px; font-size: 12px; font-weight: 600; border-radius: 20px; margin-bottom: 0;}
        .task-ket-input { flex: 1.2; min-width: 130px; margin-bottom: 0; padding: 6px; font-size: 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #ffffff; display: none; }

        button { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .btn-add { background: #f3f4f6; color: #2563eb; border: 1px dashed #2563eb; margin-bottom: 10px; }
        .btn-note-toggle { background: #f8fafc; color: #475569; border: 1px dashed #94a3b8; margin-bottom: 15px; text-align: left; font-size: 13px; }
        .btn-submit { background: #16a34a; font-size: 15px; padding: 12px; margin-top: 10px; }
        .section-box { display: none; margin-bottom: 20px; background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; }
        .help-text { font-size: 11px; color: #6b7280; display: block; margin-top: -10px; margin-bottom: 15px; }

        #kpi-notification { display: none; margin-bottom: 15px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; }

        .status-Empty { background: #ffffff; color: #6b7280; border-color: #d1d5db; }
        .status-Belum { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
        .status-OnProgress { background: #fef08a; color: #854d0e; border-color: #fde047; }
        .status-Selesai { background: #dcfce7; color: #166534; border-color: #86efac; }
        .status-Cancel { background: #e5e7eb; color: #374151; border-color: #d1d5db; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 To Do List & Update Harian</h2>
        <div style="text-align: center;">
            <span class="date-badge" id="realtime-date-badge">📅 Memuat Tanggal Real-Time...</span>
        </div>
        
        <label>Masukkan Nama Lengkap Anda (PIC)</label>
        <input type="text" id="pic-name" placeholder="Contoh: Adi Julian (ketik lengkap)" oninput="checkExistingTasks()" onblur="formatPICInputName()" required>
        <span class="help-text">Daftar tugas hari ini akan muncul otomatis setelah Anda mengetik nama lengkap PIC dengan benar.</span>

        <div id="existing-section" class="section-box">
            <div id="kpi-notification"></div>

            <label style="color:#1e40af; margin-bottom:10px;">⚡ Daftar Tugas Hari Ini:</label>
            <div id="existing-task-container"></div>
            
            <button type="button" class="btn-add" style="background:#ffffff;" onclick="addInlineTaskRow()">+ Tambah Tugas Baru Jam Ini</button>

            <button type="button" id="btn-toggle-note" class="btn-note-toggle" onclick="toggleNoteField()">📝 + Tambah Catatan / Note Tambahan</button>
            <div id="note-container" style="display: none; margin-bottom: 15px;">
                <label style="color:#374151; margin-bottom:6px;">📌 Catatan Tambahan / Note:</label>
                <textarea id="additional-note" placeholder="Tuliskan catatan atau instruksi tambahan di sini jika ada..." style="height:70px; resize:vertical; font-family:inherit; margin-bottom:0;"></textarea>
            </div>
            
            <input type="hidden" id="wa-number" value="6285721092783">
            <button type="button" id="btn-submit-main" class="btn-submit" style="background:#16a34a;" onclick="saveAndUpdateAll()">💾 Simpan Perubahan & Kirim Rekap ke WA</button>
        </div>
    </div>

    <script>
        // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA:
        const SCRIPT_URL = "MASUKKAN_URL_WEB_APP_GOOGLE_SCRIPT_ANDA_DI_SINI";

        const TEAM_CONFIG = JSON.parse(localStorage.getItem('kpi_team_config')) || {
            'Content Writer': { target: 16, members: ['Anne', 'Ayunda', 'Natasya', 'Widia'], defaultPoint: 1.0, rules: [] },
            'Graphic Designer': { target: 14, members: ['Muqita', 'Qalbi', 'Raditya', 'Ramsat'], defaultPoint: 1.0, rules: [{keyword:'carousel', point:3.5}] },
            'Video Editor': { target: 9, members: ['Adi Julian', 'Ghaly', 'Raihani'], defaultPoint: 1.0, rules: [{keyword:'edukasi', point:2.25}] },
            'Videografer': { target: 12, members: ['Dzakwan'], defaultPoint: 1.0, rules: [{keyword:'visit', point:6}, {keyword:'full', point:12}] },
            'Social Media Specialist': { target: 14, members: ['Zhera'], defaultPoint: 2.0, rules: [{keyword:'visit', point:7}] },
            'Marketing': { target: 14, members: ['Wanda'], defaultPoint: 1.0, rules: [{keyword:'proposal', point:6}] },
            'Advertiser': { target: 12, members: ['Gerry', 'Ikmal'], defaultPoint: 1.5, rules: [] }
        };

        function toTitleCase(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/(?:^|\s)\S/g, function(a) { return a.toUpperCase(); });
        }

        function formatPICInputName() {
            const inputEl = document.getElementById('pic-name');
            if (inputEl) inputEl.value = toTitleCase(inputEl.value);
        }

        function getTodayFormattedDDMMYYYY() {
            const d = new Date();
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}-${month}-${year}`;
        }

        function getCurrentTimeWIB() {
            const d = new Date();
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${hours}.${minutes} WIB`;
        }

        function formatDateToID(dateStr) {
            if (!dateStr) return '';
            if (dateStr.includes('-') && dateStr.split('-')[0].length === 2) return dateStr;
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return dateStr;
        }

        window.onload = function() {
            const d = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('realtime-date-badge').innerText = `📅 Hari ini: ${d.toLocaleDateString('id-ID', options)}`;
        };

        function getRoleByName(name) {
            if (!name) return null;
            const lower = name.trim().toLowerCase();
            for (const [role, config] of Object.entries(TEAM_CONFIG)) {
                if (config.members.some(m => m.toLowerCase() === lower)) return role;
            }
            return null;
        }

        function parseTaskQtyAndPoin(name, taskText) {
            if (!taskText) return { qty: 0, totalPoin: 0 };
            const role = getRoleByName(name) || 'Content Writer';
            const config = TEAM_CONFIG[role];
            let basePt = config ? config.defaultPoint : 1.0;

            if (config && config.rules) {
                let lowerTask = taskText.toLowerCase();
                for (let r of config.rules) {
                    let kws = r.keyword.split(',').map(k=>k.trim().toLowerCase()).filter(k=>k);
                    if (kws.some(kw => lowerTask.includes(kw))) { basePt = r.point; break; }
                }
            }

            let qty = 1;
            const rangeMatch = taskText.match(/(?:tgl|tanggal)?\s*(\d{1,2})\s*(?:-|s\/d|sampai)\s*(\d{1,2})/i);
            const listMatch = taskText.match(/(?:tgl|tanggal)?\s*(\d{1,2}(?:\s*(?:,|&|\bdan\b)\s*\d{1,2})+)/i);

            if (rangeMatch) {
                const start = parseInt(rangeMatch[1], 10);
                const end = parseInt(rangeMatch[2], 10);
                if (end >= start && end <= 31 && start >= 1) qty = (end - start + 1);
            } else if (listMatch) {
                const numbers = listMatch[0].match(/\d{1,2}/g);
                if (numbers) {
                    const validDays = numbers.filter(n => parseInt(n, 10) >= 1 && parseInt(n, 10) <= 31);
                    if (validDays.length > 0) qty = validDays.length;
                }
            }

            return { qty: qty, totalPoin: basePt * qty };
        }

        function handleStatusChange(selectEl) {
            const val = selectEl.value;
            selectEl.className = 'status-picker status-' + (val ? val.replace(/\s+/g, '') : 'Empty');
            const row = selectEl.closest('.task-row');
            const ketInput = row.querySelector('.task-ket-input');
            if (ketInput) {
                if (val === 'Belum' || val === 'Cancel') {
                    ketInput.style.display = 'block';
                    ketInput.placeholder = (val === 'Cancel') ? 'Ket. alasan cancel...' : 'Ket. jika belum selesai...';
                } else {
                    ketInput.style.display = 'none';
                }
            }
            updateKPICheck();
        }

        function updateKPICheck() {
            const rawName = document.getElementById('pic-name').value.trim();
            const name = toTitleCase(rawName);
            const notificationEl = document.getElementById('kpi-notification');
            const role = getRoleByName(name);
            
            if (!role) {
                if (notificationEl) notificationEl.style.display = 'none';
                return;
            }

            const targetKPI = TEAM_CONFIG[role] ? TEAM_CONFIG[role].target : 10;
            let grandTotalPoin = 0;
            const taskRows = document.querySelectorAll('#existing-task-container .task-row');
            
            taskRows.forEach(row => {
                let textEl = row.querySelector('.task-edit-input');
                if (textEl && textEl.value.trim() !== '') {
                    let res = parseTaskQtyAndPoin(name, textEl.value.trim());
                    grandTotalPoin += res.totalPoin;
                }
            });

            if (notificationEl) {
                notificationEl.style.display = 'block';
                if (grandTotalPoin < targetKPI) {
                    notificationEl.style.background = '#fef2f2';
                    notificationEl.style.color = '#991b1b';
                    notificationEl.style.border = '1px solid #fca5a5';
                    notificationEl.innerHTML = `⚠️ <b>Perhatian (${role}):</b> Estimasi (${grandTotalPoin} Poin) belum mencapai Target KPI (${targetKPI} Poin).`;
                } else {
                    notificationEl.style.background = '#f0fdf4';
                    notificationEl.style.color = '#166534';
                    notificationEl.style.border = '1px solid #86efac';
                    notificationEl.innerHTML = `✅ <b>Mantap (${role}):</b> Total estimasi (${grandTotalPoin} Poin) telah memenuhi Target KPI (${targetKPI} Poin)!`;
                }
            }
        }

        function toggleNoteField() {
            const noteContainer = document.getElementById('note-container');
            const btn = document.getElementById('btn-toggle-note');
            if (noteContainer.style.display === 'none') {
                noteContainer.style.display = 'block';
                btn.innerText = '📝 - Sembunyikan Catatan / Note';
            } else {
                noteContainer.style.display = 'none';
                btn.innerText = '📝 + Tambah Catatan / Note Tambahan';
            }
        }

        let fetchTimeout = null;

        async function checkExistingTasks() {
            const rawName = document.getElementById('pic-name').value.trim();
            const nameInput = toTitleCase(rawName);
            const existingSection = document.getElementById('existing-section');
            const container = document.getElementById('existing-task-container');

            const role = getRoleByName(nameInput);
            if (!role) {
                existingSection.style.display = 'none';
                return;
            }

            existingSection.style.display = 'block';

            clearTimeout(fetchTimeout);
            fetchTimeout = setTimeout(async () => {
                let today = getTodayFormattedDDMMYYYY();
                let userTasks = [];

                if (SCRIPT_URL && !SCRIPT_URL.includes("MASUKKAN_URL_WEB_APP")) {
                    try {
                        let resp = await fetch(SCRIPT_URL);
                        let allData = await resp.json();
                        userTasks = allData.filter(d => d.tanggal === today && d.nama.toLowerCase() === nameInput.toLowerCase());
                    } catch(e) {
                        console.warn("Using offline mode");
                    }
                }

                container.innerHTML = '';
                if (userTasks.length === 0) {
                    addInlineTaskRow();
                } else {
                    userTasks.forEach((t) => {
                        let row = document.createElement('div');
                        row.className = 'task-row';
                        row.innerHTML = `
                            <input type="text" class="task-client-input" value="${t.klien || ''}" placeholder="Klien...">
                            <input type="text" class="task-edit-input" value="${t.task || ''}" placeholder="To Do List..." oninput="updateKPICheck()">
                            <input type="date" class="task-deadline-input" value="${t.deadline ? t.deadline.split('-').reverse().join('-') : ''}">
                            <select class="status-picker status-${(t.status || '').replace(/\s+/g, '') || 'Empty'}" onchange="handleStatusChange(this)">
                                <option value="" ${!t.status ? 'selected disabled':''}>-- Status --</option>
                                <option value="Belum" ${t.status === 'Belum' ? 'selected':''}>Belum</option>
                                <option value="On Progress" ${t.status === 'On Progress' ? 'selected':''}>On Progress</option>
                                <option value="Selesai" ${t.status === 'Selesai' ? 'selected':''}>Selesai</option>
                                <option value="Cancel" ${t.status === 'Cancel' ? 'selected':''}>Cancel</option>
                            </select>
                            <input type="text" class="task-ket-input" value="${t.keterangan || ''}" placeholder="Keterangan..." style="${(t.status === 'Belum' || t.status === 'Cancel') ? 'display:block;' : 'display:none;'}">
                            <button type="button" style="width:32px; background:#dc2626; color:white; border:none; border-radius:4px; padding:6px;" onclick="this.parentElement.remove(); updateKPICheck();">X</button>
                        `;
                        container.appendChild(row);
                    });
                }
                updateKPICheck();
            }, 300);
        }

        function addInlineTaskRow() {
            const container = document.getElementById('existing-task-container');
            let row = document.createElement('div');
            row.className = 'task-row';
            row.innerHTML = `
                <input type="text" class="task-client-input" placeholder="Klien...">
                <input type="text" class="task-edit-input" placeholder="To Do List baru hari ini..." oninput="updateKPICheck()">
                <input type="date" class="task-deadline-input">
                <select class="status-picker status-Empty" onchange="handleStatusChange(this)">
                    <option value="" selected disabled>-- Status --</option>
                    <option value="Belum">Belum</option>
                    <option value="On Progress">On Progress</option>
                    <option value="Selesai">Selesai</option>
                    <option value="Cancel">Cancel</option>
                </select>
                <input type="text" class="task-ket-input" placeholder="Keterangan..." style="display: none;">
                <button type="button" style="width:32px; background:#dc2626; color:white; border:none; border-radius:4px; padding:6px;" onclick="this.parentElement.remove(); updateKPICheck();">X</button>
            `;
            container.appendChild(row);
            updateKPICheck();
        }

        async function saveAndUpdateAll() {
            const rawName = document.getElementById('pic-name').value.trim();
            if (!rawName) return alert('Masukkan Nama PIC terlebih dahulu!');

            const name = toTitleCase(rawName);
            const role = getRoleByName(name) || 'Content Writer';
            const targetNumber = document.getElementById('wa-number').value.trim();
            const todayStr = getTodayFormattedDDMMYYYY();
            const jamKirimStr = getCurrentTimeWIB();
            
            const taskRows = document.querySelectorAll('#existing-task-container .task-row');
            if (taskRows.length === 0) return alert('Minimal harus ada 1 tugas!');

            let tasksToSave = [];
            let waTasksList = [];

            taskRows.forEach((row) => {
                let clientEl = row.querySelector('.task-client-input');
                let textEl = row.querySelector('.task-edit-input');
                let deadlineEl = row.querySelector('.task-deadline-input');
                let statusEl = row.querySelector('.status-picker');
                let ketEl = row.querySelector('.task-ket-input');

                let clientText = clientEl ? clientEl.value.trim() : '';
                let taskText = textEl ? textEl.value.trim() : '';
                let taskDeadline = deadlineEl && deadlineEl.value ? formatDateToID(deadlineEl.value) : '';
                let taskStatus = statusEl ? statusEl.value || 'Belum' : 'Belum';
                let taskKet = ((taskStatus === 'Belum' || taskStatus === 'Cancel') && ketEl) ? ketEl.value.trim() : '';

                if(taskText === '') return;

                let parsed = parseTaskQtyAndPoin(name, taskText);
                let finalPoin = taskStatus === 'Selesai' ? parsed.totalPoin : 0;
                let fullTaskText = clientText ? `[${clientText}] ${taskText}` : taskText;

                tasksToSave.push({
                    nama: name,
                    divisi: role,
                    tanggal: todayStr,
                    jamKirim: jamKirimStr,
                    task: fullTaskText,
                    qty: parsed.qty,
                    poin: finalPoin,
                    deadline: taskDeadline,
                    status: taskStatus,
                    keterangan: taskKet
                });

                waTasksList.push({ client: clientText, task: taskText, status: taskStatus, deadline: taskDeadline, keterangan: taskKet });
            });

            const submitBtn = document.getElementById('btn-submit-main');
            if (SCRIPT_URL && !SCRIPT_URL.includes("https://script.google.com/macros/s/AKfycbwARwDuSiqlfHrX2H0kEjkRYfUCOxq8xhPwPg3JRwFb11PcmQx-IrrAR1q1ivHhVnT3MA/exec")) {
                submitBtn.disabled = true;
                submitBtn.innerText = "⌛ Menyimpan ke Tab " + name + "...";
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'save', tasks: tasksToSave, today: todayStr, nama: name })
                    });
                } catch (e) {
                    console.error("Error saving to sheet", e);
                }
                submitBtn.disabled = false;
                submitBtn.innerText = "💾 Simpan Perubahan & Kirim Rekap ke WA";
            }

            let waText = `To Do List *${name} (${todayStr.replace(/-/g, '/')})* :\n\n`;
            let ketList = [];

            waTasksList.forEach((t, i) => {
                let statusIcon = t.status === 'Selesai' ? " ✅" : (t.status === 'Belum' ? " ❌" : " ⏳");
                let clientPrefix = t.client ? `[${t.client}] ` : '';
                let dlText = t.deadline ? ` [DL: ${t.deadline}]` : '';
                
                waText += `${i + 1}. ${clientPrefix}${t.task}${dlText}${statusIcon}\n`;
                if (t.keterangan) ketList.push(`${i + 1}. ${t.keterangan}`);
            });

            if (ketList.length > 0) {
                waText += `\nKeterangan Belum Selesai / Cancel :\n` + ketList.join('\n') + '\n';
            }

            alert(`Data berhasil disimpan di Tab "${name}" Google Sheets!`);
            window.location.href = `https://api.whatsapp.com/send?phone=${targetNumber}&text=${encodeURIComponent(waText)}`;
        }
    </script>
</body>
</html>
